# Alembic configuration.
# The database URL is injected at runtime from application settings
# (see backend/alembic/env.py); it is intentionally NOT hard-coded here.

[alembic]
script_location = backend/alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is set programmatically in env.py from Settings.database_url

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
