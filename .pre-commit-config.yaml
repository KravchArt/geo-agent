# Pre-commit hooks. Install once: `uv run pre-commit install`.
# ruff + mypy run through `uv run` so they use the exact pinned versions and the
# project environment (mypy needs the project on its path).

repos:
  - repo: local
    hooks:
      # --force-exclude: pre-commit passes explicit filenames, and ruff only
      # honours the `exclude` list from pyproject for explicit paths when this is
      # set. Without it the hook reformats the generated Alembic migrations that
      # CI deliberately skips, and the two disagree forever.
      - id: ruff-lint
        name: ruff (lint)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: uv run mypy common backend tools
        language: system
        types_or: [python, pyi]
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
