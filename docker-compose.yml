# Geo-Agent local stack.
#   docker compose up            -> ui + api + redis + postgres (works with zero config)
#   docker compose --profile inference up  -> also starts vllm (needs a GPU)
#
# Values fall back to sane dev defaults, so a plain `docker compose up` works
# even without a .env file. Copy .env.example -> .env to override.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geoagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geoagent}
      POSTGRES_DB: ${POSTGRES_DB:-geoagent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geoagent} -d ${POSTGRES_DB:-geoagent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-true}
      # Service-network hostnames (override the .env defaults meant for host use).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-geoagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geoagent}
      POSTGRES_DB: ${POSTGRES_DB:-geoagent}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SESSION_TTL: ${REDIS_SESSION_TTL:-3600}
      REDIS_ECHO_TTL: ${REDIS_ECHO_TTL:-1800}
      REDIS_REF_TTL: ${REDIS_REF_TTL:-86400}
      LLM_MODE: ${LLM_MODE:-mock}
      # A model server on the HOST is reachable at host.docker.internal (see
      # extra_hosts below), never at localhost — inside a container that is the
      # container itself.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://vllm:8000/v1}
      LLM_MODEL: ${LLM_MODEL:-geoagent-model}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Agent turns add up: a tool loop on a small model can take minutes.
      LLM_TIMEOUT: ${LLM_TIMEOUT:-300}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_TOP_P: ${LLM_TOP_P:-0.9}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_REASONING_MAX_TOKENS: ${LLM_REASONING_MAX_TOKENS:-}
      LLM_HTTP_PROXY: ${LLM_HTTP_PROXY:-}
      PLACES_SEARCH_PROVIDERS: ${PLACES_SEARCH_PROVIDERS:-[]}
      ROUTING_PROVIDERS: ${ROUTING_PROVIDERS:-[]}
      TEXT_PLACE_RESOLUTION_PROVIDERS: ${TEXT_PLACE_RESOLUTION_PROVIDERS:-["tomtom"]}
      WEB_SEARCH_PROVIDERS: ${WEB_SEARCH_PROVIDERS:-[]}
      TOOLS_HTTP_TIMEOUT: ${TOOLS_HTTP_TIMEOUT:-15}
      TOOLS_EXECUTION_TIMEOUT: ${TOOLS_EXECUTION_TIMEOUT:-45}
      DGIS_CATALOG_TIMEOUT: ${DGIS_CATALOG_TIMEOUT:-3}
      TOOLS_HTTP_PROXY: ${TOOLS_HTTP_PROXY:-}
      IP_GEOLOCATION_ENABLED: ${IP_GEOLOCATION_ENABLED:-true}
      IP_GEOLOCATION_SELF_LOOKUP_ENABLED: ${IP_GEOLOCATION_SELF_LOOKUP_ENABLED:-false}
      IP_GEOLOCATION_BASE_URL: ${IP_GEOLOCATION_BASE_URL:-https://ipwho.is}
      IP_GEOLOCATION_TIMEOUT: ${IP_GEOLOCATION_TIMEOUT:-3}
      USER_CONTEXT_HTTP_PROXY: ${USER_CONTEXT_HTTP_PROXY:-}
      YANDEX_GEOCODER_API_KEY: ${YANDEX_GEOCODER_API_KEY:-}
      YANDEX_ORGANISATION_SEARCH_API_KEY: ${YANDEX_ORGANISATION_SEARCH_API_KEY:-}
      YANDEX_ROUTING_API_KEY: ${YANDEX_ROUTING_API_KEY:-}
      TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
      TOMTOM_SEARCH_BASE_URL: ${TOMTOM_SEARCH_BASE_URL:-https://api.tomtom.com/search/2}
      DGIS_API_KEY: ${DGIS_API_KEY:-}
      DGIS_CATALOG_BASE_URL: ${DGIS_CATALOG_BASE_URL:-https://catalog.api.2gis.com}
      DGIS_ROUTING_BASE_URL: ${DGIS_ROUTING_BASE_URL:-https://routing.api.2gis.com}
      GRAPHHOPPER_API_KEY: ${GRAPHHOPPER_API_KEY:-}
      GRAPHHOPPER_BASE_URL: ${GRAPHHOPPER_BASE_URL:-https://graphhopper.com/api/1}
      ROUTING_SNAP_WARNING_DISTANCE_M: ${ROUTING_SNAP_WARNING_DISTANCE_M:-250}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      OSRM_WALKING_BASE_URL: ${OSRM_WALKING_BASE_URL:-https://routing.openstreetmap.de/routed-foot}
      OSRM_USER_AGENT: ${OSRM_USER_AGENT:-GeoAgent/0.0.0}
      OSM_OVERPASS_URL: ${OSM_OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      OSM_OVERPASS_USER_AGENT: ${OSM_OVERPASS_USER_AGENT:-GeoAgent/0.0.0}
      OSM_OVERPASS_HTTP_TIMEOUT: ${OSM_OVERPASS_HTTP_TIMEOUT:-5}
      OSM_OVERPASS_RETRIES: ${OSM_OVERPASS_RETRIES:-0}
      OSM_OVERPASS_QUERY_TIMEOUT: ${OSM_OVERPASS_QUERY_TIMEOUT:-12}
      OSM_OVERPASS_MAX_ELEMENTS: ${OSM_OVERPASS_MAX_ELEMENTS:-300}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      # Scope gate. llm = classify with the scoper prompt at SCOPE_BASE_URL.
      SCOPE_PROVIDER: ${SCOPE_PROVIDER:-rule_based}
      SCOPE_BASE_URL: ${SCOPE_BASE_URL:-}
      SCOPE_API_KEY: ${SCOPE_API_KEY:-}
      SCOPE_MODEL: ${SCOPE_MODEL:-}
      # Scope classifier. classifier = e5 encoder first, LLM scoper in the grey zone.
      SCOPE_CLASSIFIER_BASE_URL: ${SCOPE_CLASSIFIER_BASE_URL:-}
      SCOPE_CLASSIFIER_API_KEY: ${SCOPE_CLASSIFIER_API_KEY:-}
      SCOPE_CLASSIFIER_MODEL: ${SCOPE_CLASSIFIER_MODEL:-}
      SCOPE_SESSION_UNLOCK: ${SCOPE_SESSION_UNLOCK:-true}
      # Distance-to-corpus check. The grey zone catches requests the classifier
      # is unsure about; this catches requests it has no grounds to judge at all.
      # Start in shadow: it logs the distance without changing any verdict.
      SCOPE_OOD_MODE: ${SCOPE_OOD_MODE:-off}
      SCOPE_OOD_INDEX_PATH: ${SCOPE_OOD_INDEX_PATH:-/app/artifacts/scope_ood_index.npz}
      SCOPE_OOD_BASE_URL: ${SCOPE_OOD_BASE_URL:-}
      SCOPE_OOD_MODEL: ${SCOPE_OOD_MODEL:-}
      SCOPE_OOD_QUANTILE: ${SCOPE_OOD_QUANTILE:-0.01}
      # Censorship gate. model = classify with the censor prompt at CENSORSHIP_BASE_URL.
      CENSORSHIP_PROVIDER: ${CENSORSHIP_PROVIDER:-rule_based}
      CENSORSHIP_BASE_URL: ${CENSORSHIP_BASE_URL:-}
      CENSORSHIP_API_KEY: ${CENSORSHIP_API_KEY:-}
      CENSORSHIP_MODEL: ${CENSORSHIP_MODEL:-}
    # Lets the container reach a model server running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 10
      # Generous: first boot runs migrations AND loads the moderation model.
      start_period: 90s
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn backend.app.main:app
      --host 0.0.0.0
      --port 8000
      "

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      API_URL: http://api:8000
      UI_PUBLIC_IP_LOOKUP_URL: ${UI_PUBLIC_IP_LOOKUP_URL:-https://api64.ipify.org?format=json}
    depends_on:
      api:
        condition: service_healthy

  # --- Optional inference backend (GPU). Started ONLY with `--profile inference`. ---
  vllm:
    image: vllm/vllm-openai:v0.24.0
    profiles: ["inference"]
    ports:
      - "8001:8000"
    # Requires an NVIDIA GPU + nvidia-container-toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # See README "vLLM — reference" for real flags (model, --served-model-name,
    # --api-key, structured-outputs backend). This is a placeholder command.
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      --served-model-name ${LLM_MODEL:-geoagent-model}
      --api-key ${LLM_API_KEY:-EMPTY}

volumes:
  pgdata:
